[package]
name = "kvp-assistant-mesh"
version = "1.0.0"
edition = "2021"
description = "KVP Assistant Mesh — живые сессии ассистентов и Memory Core Храма (без API, без облака)"

# независимый крейт вне workspace корня Храма
[workspace]

[features]
default = ["ui"]
ui = ["dep:tauri"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri = { version = "2", optional = true }

[build-dependencies]
tauri-build = "2"

[[bin]]
name = "mesh-boot"
path = "src/bin/mesh_boot.rs"

[profile.release]
opt-level = "s"
lto = "thin"
