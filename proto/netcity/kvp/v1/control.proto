syntax = "proto3";

package netcity.kvp.v1;

service ControlPlaneService {
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);
  rpc GetCommand(GetCommandRequest) returns (GetCommandResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message OpenSessionRequest {
  string client_id = 1;
  bytes client_nonce = 2;
}

message OpenSessionResponse {
  bytes session_token = 1;
  int64 expires_at_unix_ms = 2;
  bytes server_nonce = 3;
  string protocol_version = 4;
}

enum Operation {
  OPERATION_UNSPECIFIED = 0;
  OPERATION_GET_STATUS = 1;
  OPERATION_UPDATE_PARAMETERS = 2;
  OPERATION_TRIGGER_COMPACTION = 3;
  OPERATION_SWITCH_MODEL = 4;
  OPERATION_INVALIDATE_CACHE = 5;
}

message ExecuteCommandRequest {
  bytes session_token = 1;
  uint64 sequence = 2;
  string command_id = 3;
  reserved 4;
  CommandPayload payload = 5;
  int64 deadline_unix_ms = 6;
  string adapter_id = 7;
}

message CommandPayload {
  oneof command {
    UpdateParameters update_parameters = 1;
    TriggerCompaction trigger_compaction = 2;
    SwitchModel switch_model = 3;
    InvalidateCache invalidate_cache = 4;
  }
}

message UpdateParameters {
  repeated ParameterUpdate parameters = 1;
}

message ParameterUpdate {
  string name = 1;
  oneof value {
    bool bool_value = 2;
    int64 int_value = 3;
    double double_value = 4;
    string string_value = 5;
  }
}

message TriggerCompaction {
  string cache_namespace = 1;
}

message SwitchModel {
  string model_ref = 1;
  int64 drain_deadline_unix_ms = 2;
}

message InvalidateCache {
  string cache_namespace = 1;
  string scope_ref = 2;
}

enum CommandState {
  COMMAND_STATE_UNSPECIFIED = 0;
  COMMAND_STATE_ACCEPTED = 1;
  COMMAND_STATE_COMPLETED = 2;
  COMMAND_STATE_REJECTED = 3;
  COMMAND_STATE_INDETERMINATE = 4;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAUTHENTICATED = 1;
  ERROR_CODE_PERMISSION_DENIED = 2;
  ERROR_CODE_SESSION_EXPIRED = 3;
  ERROR_CODE_SEQUENCE_REJECTED = 4;
  ERROR_CODE_COMMAND_ID_CONFLICT = 5;
  ERROR_CODE_UNSUPPORTED_OPERATION = 6;
  ERROR_CODE_INVALID_COMMAND = 7;
  ERROR_CODE_DEADLINE_EXCEEDED = 8;
  ERROR_CODE_OUTCOME_INDETERMINATE = 9;
  ERROR_CODE_DEPENDENCY_UNAVAILABLE = 10;
  ERROR_CODE_INTERNAL_ERROR = 11;
}

message ExecuteCommandResponse {
  string command_id = 1;
  CommandState state = 2;
  ErrorCode error_code = 3;
  bytes result = 4;
  string audit_id = 5;
}

message GetCommandRequest {
  bytes session_token = 1;
  uint64 sequence = 2;
  string command_id = 3;
  int64 deadline_unix_ms = 4;
}

message GetCommandResponse {
  string command_id = 1;
  CommandState state = 2;
  ErrorCode error_code = 3;
  bytes result = 4;
  string audit_id = 5;
  int64 updated_at_unix_ms = 6;
}

message GetStatusRequest {
  bytes session_token = 1;
  uint64 sequence = 2;
  string adapter_id = 3;
  string request_id = 4;
  int64 deadline_unix_ms = 5;
}

message GetStatusResponse {
  string adapter_id = 1;
  string engine = 2;
  string engine_version = 3;
  repeated Operation capabilities = 4;
  double cache_usage_ratio = 5;
  int64 observed_at_unix_ms = 6;
  AttestationEvidence attestation = 7;
}

message AttestationEvidence {
  string evidence_type = 1;
  string format_version = 2;
  bytes statement = 3;
  bytes signature = 4;
  string signing_key_id = 5;
}
