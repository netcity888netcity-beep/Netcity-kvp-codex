name: Spatial Engine Checks

on:
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/spatial-engine.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/spatial-engine.yml"

jobs:
  spatial-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Spatial unit tests
        run: npm run test:spatial
      - name: Dashboard production build
        run: npm run build
