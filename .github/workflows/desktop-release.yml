name: Build NetCity KVP desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install Admin dependencies
        run: npm ci --prefix admin

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust workspace
        run: cargo test --workspace

      - name: Build Admin UI
        run: npm run build --prefix admin

      - name: Verify Electron runtime
        shell: pwsh
        run: |
          $electronRoot = Join-Path $env:GITHUB_WORKSPACE 'admin/node_modules/electron/dist'
          if (-not (Test-Path (Join-Path $electronRoot 'electron.exe'))) {
            Write-Host 'Electron binary was not present after npm ci; running the official installer script.'
            node admin/node_modules/electron/install.js
          }
          if (-not (Test-Path (Join-Path $electronRoot 'electron.exe'))) {
            Get-ChildItem admin/node_modules/electron -Force | Format-List
            throw 'Electron runtime is missing from the Windows build environment.'
          }
          & admin/node_modules/.bin/electron.cmd --version

      - name: Package portable Electron runtime
        run: npm run desktop:portable --prefix admin

      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path admin/release/* -DestinationPath NetCity-KVP-portable.zip -CompressionLevel Optimal

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build per-user installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/build-electron-installer.ps1

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netcity-kvp-windows
          if-no-files-found: error
          path: NetCity-KVP-portable.zip

      - name: Upload installer artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: netcity-kvp-windows-installer
          if-no-files-found: error
          path: admin/release-installer/NetCity-KVP-Setup-*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            NetCity-KVP-portable.zip `
            admin/release-installer/NetCity-KVP-Setup-*.exe `
            --generate-notes `
            --title "NetCity KVP $env:GITHUB_REF_NAME"
