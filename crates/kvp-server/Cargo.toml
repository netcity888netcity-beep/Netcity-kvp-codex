[package]
name = "kvp-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.12", features = ["tls", "tls-roots"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
